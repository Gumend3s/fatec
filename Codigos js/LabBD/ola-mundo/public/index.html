<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Olá Mundo - Node.js</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 20px;
      }
      .container {
        background: white;
        padding: 60px 40px;
        border-radius: 20px;
        box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        text-align: center;
        max-width: 600px;
        animation: slideIn 0.6s ease-out;
      }
      h1 {
        color: #333;
        font-size: 3em;
        margin-bottom: 20px;
      }
      .emoji {
        font-size: 5em;
        margin-bottom: 20px;
        animation: bounce 1s infinite;
      }

      p {
        color: #666;
        font-size: 1.3em;
        line-height: 1.6;
        margin-bottom: 30px;
      }
      .info-box {
        background: #f0f4ff;
        padding: 20px;
        border-radius: 10px;
        margin-top: 30px;
        border-left: 5px solid #667eea;
      }
      .info-box h3 {
        color: #667eea;
        margin-bottom: 10px;
      }
      .info-box p {
        font-size: 1em;
        color: #555;
      }
      @keyframes slideIn {
        from {
          opacity: 0;
          transform: translateY(-30px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }
      @keyframes bounce {
        0%,
        100% {
          transform: translateY(0);
        }
        50% {
          transform: translateY(-10px);
        }
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h1>Olá Mundo!</h1>
      <p>Parabéns! Você criou sua primeira aplicação web com Node.js!</p>
      <p>Este é o começo de uma jornada incrível no desenvolvimento web.</p>
      <div class="info-box">
        <h3>Tecnologias Utilizadas</h3>
        <p>
          <strong>Backend:</strong> Node.js + HTTP Module<br />
          <strong>Frontend:</strong> HTML + CSS<br />
          <strong>Editor:</strong> Visual Studio Code
        </p>
      </div>
    </div>
  </body>
</html>
